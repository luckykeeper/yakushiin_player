name: yakushiin_player
description: "YakushiinPlayer By Luckykeeper"
publish_to: 'none'
version: 1.0.2+3

environment:
# dev_with: flutter 3.47.2 | vs2026
  sdk: ^3.7.0

dependencies:
  # 注意：3.8.0 引入了 material_ui 依赖（自带同名 ThemeData 与 SDK 冲突），锁定 3.7.2
  adaptive_theme: 3.7.2
  bot_toast: ^4.1.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.4.3
  flutter_smart_dialog: ^4.9.8+7
  logger: ^2.7.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  window_manager: ^0.5.2
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.3.1
  flutter_native_splash: ^2.4.8
  hive_ce: any
  hive_ce_flutter: any
  dio: ^5.11.1
  wakelock_plus: ^1.8.0
  flutter_volume_controller: ^2.0.2
  pedometer: ^4.2.0
  geolocator: ^14.0.3
  weather: ^3.1.1
  geolocator_android: ^5.0.3
  geolocator_web: ^4.1.4
  geolocator_apple: ^2.3.14
  geolocator_windows: ^0.2.5
  # flutter_background: ^1.3.0+1
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  tray_manager: ^0.5.3
  disable_battery_optimization: ^1.1.2
  flutter_local_notifications: ^22.3.0
  

# 锁定回退：path_provider_android 2.3.1 的 Pigeon 通道在 release 构建下
# 报 PlatformException(channel-error) 导致启动失败（debug 正常），已实测 2.2.19 正常。
# 上游修复后可移除此覆盖。
dependency_overrides:
  path_provider_android: 2.2.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  hive_ce_generator: any

flutter:
  uses-material-design: true

  assets:
    - assets/images/Yakushiin-fit-0.75x.png
    - assets/images/operationFailedYakushiin.jpg
    - assets/images/operationSuccessYakushiin.jpg
    - assets/images/splash.png
    - assets/images/lockup_flutter_horizontal.png
    - assets/images/app_icon.png
    - assets/images/app_icon.ico
    - assets/shaders/

  fonts:
    # - family: LXGWWenKai
    #   fonts:
    #     - asset: lib/theme/fonts/LXGWWenKai/LXGWWenKai-Medium.ttf
    #       weight: 500
    #     - asset: lib/theme/fonts/LXGWWenKai/LXGWWenKai-Regular.ttf
    #       weight: 400
    #     - asset: lib/theme/fonts/LXGWWenKai/LXGWWenKai-Light.ttf
    #       weight: 300
    - family: simkai
      fonts:
        - asset: lib/theme/fonts/simkai.ttf
        
flutter_native_splash:
  color: "#79c4be"
  image: assets/images/splash.png
  branding: assets/images/lockup_flutter_horizontal.png
  android_12:
    color: "#79c4be"
    image: assets/images/splash.png
    branding: assets/images/lockup_flutter_horizontal.png